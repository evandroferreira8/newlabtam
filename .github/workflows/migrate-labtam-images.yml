name: Migrate LabTam images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-labtam-images.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download external LabTam images and localize references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re, ssl

          ROOT = Path(".")
          BASE = "https://labtam.ccet.ufrn.br/assets/img/"
          pattern = re.compile(r'https://labtam\.ccet\.ufrn\.br/assets/img/[^"\'\s)<>{}]+')
          text_exts = {".html", ".js", ".css"}
          files = [p for p in ROOT.rglob("*") if p.is_file() and p.suffix.lower() in text_exts and ".git" not in p.parts]

          contents, urls = {}, set()
          for p in files:
              try:
                  txt = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              contents[p] = txt
              urls.update(pattern.findall(txt))

          print(f"Found {len(urls)} external LabTam image URLs")
          ctx = ssl.create_default_context()
          headers = {"User-Agent": "Mozilla/5.0 LabTamImageMigration/1.1"}

          def looks_like_image(data):
              return (
                  data.startswith(b"\xff\xd8\xff") or
                  data.startswith(b"\x89PNG\r\n\x1a\n") or
                  data.startswith(b"GIF87a") or
                  data.startswith(b"GIF89a") or
                  (data.startswith(b"RIFF") and len(data) >= 12 and data[8:12] == b"WEBP")
              )

          def fetch(url):
              encoded_rel = url[len(BASE):]
              decoded_rel = unquote(encoded_rel)
              target = ROOT / "assets" / "images" / decoded_rel
              try:
                  req = Request(url, headers=headers)
                  with urlopen(req, timeout=12, context=ctx) as r:
                      data = r.read()
                      ctype = (r.headers.get("Content-Type") or "").lower()
                  if not data:
                      raise RuntimeError("empty response")
                  if not ("image/" in ctype or looks_like_image(data)):
                      raise RuntimeError(f"not an image ({ctype or 'unknown content-type'})")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  local = "assets/images/" + quote(decoded_rel, safe="/-_.~")
                  return url, local, len(data), None
              except Exception as e:
                  return url, None, 0, str(e)

          results = []
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs = [ex.submit(fetch, u) for u in sorted(urls)]
              for fut in as_completed(futs):
                  results.append(fut.result())

          successes = [(u,l,n) for u,l,n,e in results if l]
          failures = [(u,e) for u,l,n,e in results if not l]

          for url, local, n in successes:
              for p, txt in list(contents.items()):
                  if url in txt:
                      contents[p] = txt.replace(url, local)

          for p, txt in contents.items():
              if txt != p.read_text(encoding="utf-8"):
                  p.write_text(txt, encoding="utf-8")

          report = [
              "# LabTam image migration report",
              "",
              f"- External image URLs found: {len(urls)}",
              f"- Successfully localized: {len(successes)}",
              f"- Still external / failed: {len(failures)}",
              "",
              "## Localized",
              *[f"- `{u}` → `{l}` ({n} bytes)" for u,l,n in sorted(successes)],
              "",
              "## Failed",
              *[f"- `{u}` — {e}" for u,e in sorted(failures)],
              ""
          ]
          Path("IMAGE-MIGRATION-REPORT.md").write_text("\n".join(report), encoding="utf-8")
          print(f"Migration complete: {len(successes)} localized; {len(failures)} failed.")
          PY

      - name: Commit migrated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images index.html "*.html" assets/js assets/css IMAGE-MIGRATION-REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Localize LabTam images for reliable GitHub Pages loading"
            git pull --rebase origin main
            git push
          fi
