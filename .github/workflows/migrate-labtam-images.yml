name: Migrate LabTam images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-labtam-images.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download external LabTam images and localize references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote, quote
          from urllib.request import Request, urlopen
          import re, time, ssl

          ROOT = Path(".")
          BASE = "https://labtam.ccet.ufrn.br/assets/img/"
          pattern = re.compile(r'https://labtam\.ccet\.ufrn\.br/assets/img/[^"\'\s)<>{}]+')
          text_exts = {".html", ".js", ".css"}
          files = [p for p in ROOT.rglob("*") if p.is_file() and p.suffix.lower() in text_exts and ".git" not in p.parts]

          contents = {}
          urls = set()
          for p in files:
              try:
                  txt = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              contents[p] = txt
              urls.update(pattern.findall(txt))

          print(f"Found {len(urls)} external LabTam image URLs")
          successes = []
          failures = []

          ctx = ssl.create_default_context()
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; LabTamImageMigration/1.0; +https://github.com/evandroferreira8/newlabtam)"
          }

          def looks_like_image(data: bytes):
              return (
                  data.startswith(b"\xff\xd8\xff") or
                  data.startswith(b"\x89PNG\r\n\x1a\n") or
                  data.startswith(b"GIF87a") or
                  data.startswith(b"GIF89a") or
                  data.startswith(b"RIFF") and data[8:12] == b"WEBP"
              )

          for i, url in enumerate(sorted(urls), 1):
              encoded_rel = url[len(BASE):]
              decoded_rel = unquote(encoded_rel)
              target = ROOT / "assets" / "images" / decoded_rel
              target.parent.mkdir(parents=True, exist_ok=True)

              ok = False
              last_error = None
              for attempt in range(3):
                  try:
                      req = Request(url, headers=headers)
                      with urlopen(req, timeout=30, context=ctx) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()
                      if not data:
                          raise RuntimeError("empty response")
                      if not ("image/" in content_type or looks_like_image(data)):
                          raise RuntimeError(f"response is not an image ({content_type or 'unknown content-type'})")
                      target.write_bytes(data)
                      ok = True
                      break
                  except Exception as e:
                      last_error = e
                      time.sleep(2 * (attempt + 1))

              if ok:
                  local_url = "assets/images/" + quote(decoded_rel, safe="/-_.~")
                  for p, txt in list(contents.items()):
                      if url in txt:
                          contents[p] = txt.replace(url, local_url)
                  successes.append((url, local_url, len(data)))
                  print(f"[{i}/{len(urls)}] OK   {url} -> {local_url} ({len(data)} bytes)")
              else:
                  failures.append((url, str(last_error)))
                  print(f"[{i}/{len(urls)}] FAIL {url}: {last_error}")

          for p, txt in contents.items():
              old = p.read_text(encoding="utf-8")
              if txt != old:
                  p.write_text(txt, encoding="utf-8")

          report = [
              "# LabTam image migration report",
              "",
              f"- External image URLs found: {len(urls)}",
              f"- Successfully localized: {len(successes)}",
              f"- Still external / failed: {len(failures)}",
              "",
              "## Localized",
          ]
          report += [f"- `{u}` → `{l}` ({n} bytes)" for u,l,n in successes]
          report += ["", "## Failed"]
          report += [f"- `{u}` — {e}" for u,e in failures]
          Path("IMAGE-MIGRATION-REPORT.md").write_text("\n".join(report) + "\n", encoding="utf-8")

          print(f"Migration complete: {len(successes)} localized; {len(failures)} failed.")
          PY

      - name: Commit migrated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images index.html "*.html" assets/js assets/css IMAGE-MIGRATION-REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Localize LabTam images for reliable GitHub Pages loading"
            git push
          fi
